[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "issf-cbf-ur5e"
version = "1.0.0"
description = "ISSf-CBF safety filter and admittance control for UR5e (hardware-in-the-loop), built on Operational Space Control Barrier Functions (OSCBF)"
authors = [
    { name = "Yahya Bachtiar Ivansyah", email = "yahyabachtiar03@gmail.com" },
    { name = "Daniel Morton", email = "danielpmorton@gmail.com" },  # original OSCBF author
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.12"
keywords = ["control", "barrier", "function", "CBF", "ISSf", "Jax", "operational", "space", "safe", "robotics", "UR5e", "admittance", "hardware-in-the-loop"]
# TODO: Have a better way of managing these dependencies
# There was a slowdown introduced in jax 0.4.32
# cbfpy 0.0.1 is pinned because later versions changed the API, and it requires numpy<2.
# Pinocchio is NOT listed here: the PyPI "pin" wheel requires numpy>=2, so install it
# from conda-forge instead:  conda install -c conda-forge pinocchio=3.4.0
dependencies = [
    "numpy<2",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "cbfpy==0.0.1",
    "qpax",
    "pybullet>=3.2.7", # Pybullet < 3.2.7 has trouble with numpy 2.0
    "matplotlib",
    # Dependencies from urdfpy... I should try to remove some of these
    "networkx",
    "lxml",
    "trimesh",
    "ur_rtde>=1.6.2",
    "prometheus-client>=0.23.1",
]

[project.urls]
Repository = "https://github.com/chidorisasuke/issf-cbf-ur5e"
Upstream = "https://github.com/StanfordASL/oscbf"

[project.optional-dependencies]
dev = ["pylint", "black"]

[tool.setuptools.packages.find]
include = ["oscbf", "oscbf.*", "osissf", "osissf.*"]
exclude = ["artifacts", "images", "test*"]

[project.scripts]
osissf-run = "osissf.experiment.run_ur5e:main"

[tool.setuptools.package-data]
oscbf = ["assets/**/*"]
