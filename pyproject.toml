[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oscbf-ur5e"
version = "0.1.0"
description = "Operational Space Control Barrier Functions"
authors = [{ name = "Daniel Morton", email = "danielpmorton@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.12"
keywords = ["control", "barrier", "function", "CBF", "Jax", "operational", "space", "safe", "robotics"]
# TODO: Have a better way of managing these dependencies
# There was a slowdown introduced in jax 0.4.32
dependencies = [
    "numpy<2",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "cbfpy==0.0.1",
    "qpax",
    "pybullet>=3.2.7", # Pybullet < 3.2.7 has trouble with numpy 2.0
    "matplotlib",
    # Dependencies from urdfpy... I should try to remove some of these
    "networkx",
    "lxml",
    "trimesh",
    "ur_rtde",
    "prometheus-client",
]

[project.urls]
Repository = "https://github.com/stanfordasl/oscbf/"

[project.optional-dependencies]
dev = ["pylint", "black"]

[tool.setuptools.packages.find]
include = ["oscbf", "oscbf.*", "osissf", "osissf.*"]
exclude = ["artifacts", "images", "test*"]

[project.scripts]
osissf-run = "osissf.experiment.run_ur5e:main"

[tool.setuptools.package-data]
oscbf = ["assets/**/*"]
